name: Refresh and publish Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-pages
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh jobs snapshot
        run: npm run refresh-jobs

      - name: Build Pages mirror
        run: npm run build-pages-mirror

      - name: Mirror to repository root
        run: |
          cp docs/index.html index.html
          cp docs/jobs.json jobs.json
          cp docs/.nojekyll .nojekyll

      - name: Commit refreshed mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json docs index.html jobs.json .nojekyll
          git diff --cached --quiet || git commit -m "Refresh jobs snapshot [skip ci]"

      - name: Push changes
        run: git push origin HEAD:main
